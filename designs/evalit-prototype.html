.compose .cnode { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border: 1px solid var(--border); border-radius: var(--radius-pill); font-size: 12.5px; background: var(--bg); }
.compose .cnode svg { width: 12px; height: 12px; color: var(--fg-2); }
.compose .arr { color: var(--fg-2); font-family: var(--font-mono); }
.compose .miss { color: var(--warn); font-size: 12px; }
.maplay { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
.srcgrp { margin-bottom: 16px; }
.srcgrp h4 { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-2); margin: 0 0 9px; font-weight: 500; }
.srcrow { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: var(--bg); font-family: var(--font-mono); font-size: 11.5px;
  cursor: grab; user-select: none;
}
.chip:hover { border-color: var(--fg); }
.chip.dragging { opacity: 0.45; }
.chip svg { width: 11px; height: 11px; color: var(--fg-2); }
.chip .drill { border: 0; background: none; color: var(--fg-2); cursor: pointer; font-size: 10.5px; padding: 0 0 0 2px; font-family: var(--font-mono); text-decoration: underline dotted; }
.chip .drill:hover { color: var(--fg); }
.chip.static { cursor: default; }
.slot {
  display: flex; align-items: center; gap: 8px; min-height: 38px; border: 1px dashed var(--border);
  border-radius: var(--radius-md); padding: 3px 7px; cursor: pointer; background: var(--bg);
  transition: border-color var(--motion-fast), background var(--motion-fast);
}
.slot:hover { border-color: var(--fg-2); }
.slot.dragover { border-color: var(--fg); border-style: solid; background: var(--surface-warm); }
.slot.filled { border-style: solid; border-color: var(--border); }
.slot .ph { font-size: 12px; color: var(--fg-2); padding: 0 4px; }
.slot .rm { margin-left: auto; border: 0; background: none; color: var(--fg-2); cursor: pointer; display: grid; place-items: center; padding: 3px; border-radius: var(--radius-sm); }
.slot .rm:hover { color: var(--danger); }
.slot .rm svg { width: 11px; height: 11px; }
.varrow { display: grid; grid-template-columns: 168px 1fr; gap: 12px; align-items: center; }
.varrow + .varrow { margin-top: 9px; }
.varrow .vn { font-family: var(--font-mono); font-size: 12px; font-weight: 500; word-break: break-all; }
.varrow .vd { font-size: 11px; color: var(--fg-2); margin-top: 3px; line-height: 1.45; }
.mapcard { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); padding: 15px 17px; }
.mapcard + .mapcard { margin-top: 14px; }
.mapcard h4 { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin: 0 0 4px; }
.mapcard h4 svg { width: 13px; height: 13px; color: var(--fg-2); }
.mapcard .md { font-size: 11.5px; color: var(--fg-2); margin-bottom: 13px; }

/* ─── JSON 树 / 代码块 / 日志 ───────────────────────────────── */
.jt { font-family: var(--font-mono); font-size: 12px; line-height: 1.75; }
.jt .car { width: 15px; display: inline-block; cursor: pointer; color: var(--fg-2); user-select: none; }
.jt .car:hover { color: var(--fg); }
.jt .k { color: var(--fg-2); }
.jt .v { color: var(--fg); }
.jt .ty { color: var(--fg-2); font-size: 10.5px; margin-left: 7px; }
.jt .kids { margin-left: 4px; padding-left: 14px; border-left: 1px solid var(--border-soft); }
.jt .leaf { cursor: pointer; padding: 1px 6px; border-radius: var(--radius-sm); display: inline-block; }
.jt .leaf:hover { background: var(--surface-warm); }
.jt .leaf.sel { background: var(--fg); color: var(--bg); }
.jt .leaf.sel .k, .jt .leaf.sel .v, .jt .leaf.sel .ty { color: inherit; }
.codeblk {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.65; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; overflow: auto;
  white-space: pre; margin: 0; tab-size: 2;
}
.codeblk.tall { max-height: 300px; }
.log {
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.85; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 15px; max-height: 230px; overflow: auto;
}
.log .t { color: var(--fg-2); margin-right: 12px; }
.log .err { color: var(--danger); }

/* ─── 指标统计（数据可视化） ────────────────────────────────── */
.kpirow { display: flex; gap: 28px; flex-wrap: wrap; }
.stat-tile .lb { font-size: 12px; color: var(--fg-2); }
.stat-tile .vl { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.25; margin-top: 3px; }
.stat-tile .vl small { font-size: 13px; font-weight: 500; color: var(--fg-2); margin-left: 2px; }
.stat-tile .dt { font-size: 11.5px; color: var(--fg-2); margin-top: 3px; font-family: var(--font-mono); }
.meter { height: 6px; background: var(--surface-warm); border-radius: var(--radius-pill); overflow: hidden; position: relative; }
.meter > i { display: block; height: 100%; background: var(--fg); border-radius: 0 3px 3px 0; transition: width var(--motion-base) var(--ease-standard); }
.meter.thin { height: 4px; }
.distrow { display: grid; grid-template-columns: 92px 1fr 108px; gap: 12px; align-items: center; }
.distrow + .distrow { margin-top: 9px; }
.distrow .dl { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.distrow .dv { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); text-align: right; white-space: nowrap; }
.bar-mark { height: 12px; border-radius: 0 3px 3px 0; background: var(--fg); min-width: 2px; }
.stackbar { display: flex; height: 12px; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface-warm); }
.stackbar .s1 { background: var(--fg); }
.stackbar .s2 { background: color-mix(in oklab, var(--fg) 22%, var(--bg)); }
.stackbar .s1 + .s2 { border-left: 2px solid var(--bg); }
.rng { position: relative; height: 14px; margin: 4px 0 2px; }
.rng .track { position: absolute; top: 6px; left: 0; right: 0; height: 2px; background: var(--border); border-radius: 1px; }
.rng .fill { position: absolute; top: 6px; height: 2px; background: var(--fg); border-radius: 1px; }
.rng .end { position: absolute; top: 3.5px; width: 7px; height: 7px; border-radius: 50%; background: var(--bg); border: 2px solid var(--fg); margin-left: -4px; }
.rng .mean { position: absolute; top: 1px; width: 2px; height: 12px; background: var(--fg); margin-left: -1px; }
.rnglabs { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
.rnglabs b { color: var(--fg); font-weight: 600; }
.covbar { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.covbar .ci { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11.5px; }
.covbar .ci .dot { width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.note { font-size: 11.5px; color: var(--fg-2); line-height: 1.6; padding-top: 12px; border-top: 1px solid var(--border-soft); margin-top: 16px; }

/* ─── 进度 / 键值 / 其他 ────────────────────────────────────── */
.progrow { display: grid; grid-template-columns: 210px 1fr 78px; gap: 14px; align-items: center; }
.progrow + .progrow { margin-top: 11px; }
.progrow .pl { font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
.progrow .pl svg { width: 13px; height: 13px; color: var(--fg-2); flex: none; }
.progrow .pn { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); text-align: right; }
.kv { display: grid; grid-template-columns: 118px 1fr; gap: 7px 16px; font-size: 12.5px; }
.kv dt { color: var(--fg-2); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
.hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
.spin {
  width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--border);
  border-top-color: var(--fg); animation: spin 0.7s linear infinite; display: inline-block; vertical-align: -2px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 15px; border-radius: var(--radius-md);
  font-size: 12.5px; line-height: 1.6; border: 1px solid var(--border); background: var(--surface);
}
.banner svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
.banner.warn { border-color: color-mix(in oklab, var(--warn) 45%, transparent); color: var(--fg); }
.banner.warn svg { color: var(--warn); }
.banner.danger { border-color: color-mix(in oklab, var(--danger) 45%, transparent); }
.banner.danger svg { color: var(--danger); }
.mini-tabs { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.mini-tab { border: 0; background: var(--bg); padding: 6px 13px; font-size: 12.5px; color: var(--fg-2); }
.mini-tab + .mini-tab { border-left: 1px solid var(--border); }
.mini-tab.on { background: var(--fg); color: var(--bg); font-weight: 550; }
.mini-tab:focus-visible, .xbtn:focus-visible, .opt-row:focus-within { outline: none; box-shadow: var(--focus-ring); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--fg-2); }
.small { font-size: 12px; }
.version-link { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 2px 0; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
.version-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); }
.pager .pages { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); }
.locked { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-2); }
.history-row { display: grid; grid-template-columns: 76px 1fr 112px 88px; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border-soft); }
.history-row:first-child { border-top: 0; }
.history-row .hv { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.history-row .hd { font-size: 12px; color: var(--fg-2); }
.history-row .ht { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }

/* PRD 走查修订：阅读、触控、键盘与窄屏布局 */
h1,h2,h3,h4 { font-family:var(--font-display); }
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible { outline:2px solid var(--fg); outline-offset:3px; box-shadow:var(--focus-ring); }
.btn,.btn-sm,.link-btn,.nav-item,.tab,.mini-tab,.xbtn,.version-link { min-height:44px; }
.xbtn,.slot .rm { min-width:44px; min-height:44px; }
.input,.select { min-height:44px; }
.opt-row svg { width:20px; height:20px; flex:none; }
.panel,.panel-b,.page,.d-b,.mapcard,.grid-2>*,.grid-3>*,.frow>*,.phead>*,.varrow>* { min-width:0; }
.phead { align-items:flex-start; flex-wrap:wrap; }
.phead .row,.panel-h,.d-f,.row-between { flex-wrap:wrap; }
.phead>div:last-child { max-width:100%; }
.tbl { table-layout:auto; }
.tbl td,.kv dd { overflow-wrap:anywhere; }
.tbl .rowname { min-width:120px; }
.table-scroll { max-width:100%; overflow-x:auto; }
.table-scroll>.tbl { min-width:700px; }
.codeblk { white-space:pre-wrap; overflow-wrap:anywhere; max-height:360px; }
.is-success { color:color-mix(in oklch,var(--success) 83%,var(--fg)); }
.is-warn { color:color-mix(in oklch,var(--warn) 80%,var(--fg)); }
.mini-tab:hover { color:var(--fg); background:var(--surface-warm); }
.mini-tab.on:hover { color:var(--bg); background:var(--fg); }
.btn-danger:hover { background:var(--danger); color:var(--bg); }
.chip,.slot { min-height:44px; max-width:100%; overflow-wrap:anywhere; }
.chip span { min-width:0; overflow-wrap:anywhere; }
.slot>.chip { flex-wrap:wrap; }
.jt .car,.jt .leaf { min-height:44px; line-height:44px; }
.jt .car { min-width:28px; }
.toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.toolbar .input { max-width:320px; }.toolbar .select { width:auto; }
.field-error { display:block; color:var(--danger); font-size:12px; padding-top:8px; }
.demo-note { font-size:12px; color:var(--fg-2); padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); }
.stat-tile .vl { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.distrow .dl { white-space:normal; overflow:visible; overflow-wrap:anywhere; }
@media(max-width:1200px) { .body{grid-template-columns:192px minmax(0,1fr)} .page{padding:24px 24px 64px}.maplay{grid-template-columns:270px minmax(0,1fr);gap:16px}.varrow{grid-template-columns:132px minmax(0,1fr)}.header-row{grid-template-columns:minmax(100px,1fr) 120px minmax(120px,1fr) 44px} }
@media(max-width:920px) { .body{grid-template-columns:156px minmax(0,1fr)}.page{padding:24px 16px 48px}.grid-2,.grid-3,.frow,.maplay{grid-template-columns:minmax(0,1fr)}.wiz-steps{flex-wrap:wrap}.wstep{min-width:45%;white-space:normal}.phead .row{flex-wrap:wrap}.header-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.progrow{grid-template-columns:minmax(0,1fr) minmax(80px,1fr) 60px}.kv{grid-template-columns:90px minmax(0,1fr)} }
@media(max-width:600px) { .app{grid-template-rows:42px minmax(0,1fr)}.body{display:flex;flex-direction:column}.sidebar{flex:none;display:flex;flex-direction:row;gap:4px;flex-wrap:wrap;border-right:0;padding:8px;border-bottom:1px solid var(--border)}.brand,.navgroup,.sidefoot,.nav-item svg,.nav-item .cnt{display:none}.nav-item{width:auto;font-size:12px;min-height:44px;padding:6px 9px}.main{flex:1;min-height:0}.tb-env{font-size:9px}.tb-title{font-size:10px}.tl{display:none}.phead h1{font-size:22px}.varrow{grid-template-columns:minmax(0,1fr)}.dialog,.dialog.wide{width:calc(100vw - 24px);max-height:92dvh}.d-b{padding:14px}.history-row{grid-template-columns:75px minmax(0,1fr)}.pager{flex-wrap:wrap}.phead .btn{padding-inline:10px}.progrow{grid-template-columns:minmax(0,1fr) 70px}.progrow .meter{grid-row:2;grid-column:1/-1}.distrow{grid-template-columns:80px minmax(0,1fr) 94px}.codeblk{font-size:11px} }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important;transition:none!important} }

/* 本地 CSV：源表头 → 标准字段；复用映射画布与 Minimal 组件 */
.csv-mapper { font-size:var(--text-base); line-height:var(--leading-body); }
.csv-map-layout { grid-template-columns:minmax(0,2fr) minmax(0,3fr); gap:var(--space-6); }
.csv-mapper h4 { margin:0; font-size:var(--text-base); }
.csv-mapper .csv-help { margin:0; color:var(--fg-2); font-size:var(--text-sm); line-height:var(--leading-body); overflow-wrap:anywhere; }
.csv-source-area,.csv-target { min-width:0; padding:var(--space-4); border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); }
.csv-source-area > .od-row,.csv-target > .od-row { align-items:flex-start; flex-wrap:wrap; gap:var(--space-3); }
.csv-source-list,.csv-target-list { gap:var(--space-3); }
.csv-source-list { margin-top:var(--space-4); }
.csv-source { min-width:0; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--bg); }
.csv-source.is-selected,.csv-bound.is-selected { border-color:var(--fg); background:var(--surface-warm); box-shadow:var(--elev-ring); }
.csv-header-source,.csv-bound-drag { display:flex; align-items:center; gap:var(--space-3); min-width:0; min-height:44px; padding:var(--space-3); border:0; border-radius:var(--radius-md); background:transparent; color:var(--fg); text-align:left; font:inherit; cursor:grab; }
.csv-header-source { width:100%; }
.csv-header-source:active,.csv-bound-drag:active { cursor:grabbing; }
.csv-header-source strong,.csv-bound-drag .csv-header-name { display:block; font-family:var(--font-mono); font-size:var(--text-base); overflow-wrap:anywhere; }
.csv-grip { display:flex; flex:none; align-items:center; color:var(--fg-2); }
.csv-grip svg { width:16px; height:16px; }
.csv-sample { border-top:1px solid var(--border-soft); }
.csv-sample summary { display:block; min-height:44px; padding:var(--space-2) var(--space-3); color:var(--fg-2); font-size:var(--text-sm); cursor:pointer; list-style:none; }
.csv-sample summary::-webkit-details-marker { display:none; }
.csv-sample-label { display:block; padding:var(--space-2) var(--space-3) var(--space-1); color:var(--fg-2); font-size:var(--text-sm); }
.csv-sample-heading { justify-content:space-between; gap:var(--space-2); }
.csv-sample-heading > span { display:block; }
.csv-sample-expand,.csv-sample-collapse { color:var(--fg); white-space:nowrap; }
.csv-sample .csv-sample-collapse { display:none; }
.csv-sample-preview { margin-top:var(--space-1); overflow-wrap:anywhere; }
.csv-sample[open] .csv-sample-preview,.csv-sample[open] .csv-sample-expand { display:none; }
.csv-sample[open] .csv-sample-collapse { display:block; }
.csv-sample pre { margin:0; padding:0 var(--space-3) var(--space-3); font:var(--text-sm)/var(--leading-body) var(--font-mono); color:var(--fg); white-space:pre-wrap; overflow-wrap:anywhere; }
.csv-count { display:block; flex:none; font-size:var(--text-sm); color:var(--fg-2); white-space:nowrap; }
.csv-target { background:var(--bg); }
.csv-target h4 { font-family:var(--font-mono); overflow-wrap:anywhere; }
.csv-target-fields { margin-top:var(--space-3); gap:var(--space-2); }
.csv-bound { display:flex; align-items:center; max-width:100%; min-width:0; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); }
.csv-bound-drag { flex:1 1 auto; }
.csv-remove { display:grid; place-items:center; flex:none; min-width:44px; min-height:44px; padding:var(--space-2); margin-left:var(--space-2); border:0; border-radius:var(--radius-sm); background:transparent; color:var(--fg-2); cursor:pointer; }
.csv-remove svg { width:16px; height:16px; }
.csv-drop-button { display:flex; align-items:center; justify-content:center; gap:var(--space-2); width:100%; min-height:56px; padding:var(--space-3); margin-top:var(--space-3); border:1px dashed var(--border); border-radius:var(--radius-md); background:var(--surface); color:var(--fg-2); font:inherit; cursor:pointer; }
.csv-drop-button svg { width:16px; height:16px; flex:none; }
.csv-target.is-dragover,.csv-source-area.is-dragover { border-color:var(--fg); background:var(--surface-warm); box-shadow:inset 0 0 0 1px var(--fg); }
.csv-target.is-dragover .csv-drop-button { border-color:var(--fg); border-style:solid; color:var(--fg); background:var(--surface-warm); }
.csv-source.is-dragging,.csv-bound.is-dragging { border-color:var(--fg); border-style:dashed; background:var(--surface-warm); }
.csv-map-status { min-height:48px; margin:var(--space-4) 0; padding:var(--space-3) var(--space-4); border:1px solid var(--border-soft); border-radius:var(--radius-md); background:var(--surface); color:var(--fg-2); overflow-wrap:anywhere; }
.csv-map-preview { margin-top:var(--space-6); }
.csv-map-preview .codeblk { margin-top:var(--space-3); }
.table-scroll > .tbl.csv-result-table { min-width:0; width:100%; table-layout:fixed; }
.csv-result-table thead th:first-child { width:56px; }
.csv-result-table tbody th,.csv-result-table td { vertical-align:top; }
.csv-result-value { margin:0; max-width:100%; color:var(--fg); font:var(--text-sm)/var(--leading-body) var(--font-mono); white-space:pre-wrap; overflow-wrap:anywhere; }
.csv-result-empty { color:var(--fg-2); font-size:var(--text-sm); }
@media(max-width:768px) {
  .csv-result-table thead { display:none; }
  .csv-result-table,.csv-result-table tbody,.csv-result-table tr,.csv-result-table tbody th,.csv-result-table td { display:block; width:100%; }
  .csv-result-table tbody th { padding:var(--space-3) var(--space-4); background:var(--surface); }
  .csv-result-table td { padding:var(--space-3) var(--space-4); border-bottom:0; }
  .csv-result-table tr { border-bottom:1px solid var(--border); }
  .csv-result-table td::before { content:attr(data-field-label); display:block; margin-bottom:var(--space-2); color:var(--fg-2); font:600 var(--text-sm)/var(--leading-body) var(--font-mono); }
}
.csv-mapper .ferr { margin-top:var(--space-3); }
@media(hover:hover) {
  .csv-header-source:hover,.csv-bound-drag:hover,.csv-sample summary:hover { background:var(--surface-warm); color:var(--fg); }
  .csv-remove:hover { background:var(--surface-warm); color:var(--fg); }
  .csv-drop-button:hover { border-color:var(--fg); background:var(--surface-warm); color:var(--fg); }
}
@media(max-width:1024px) { .csv-map-layout { grid-template-columns:minmax(0,1fr); } }
@media(max-width:375px) { .csv-source-area,.csv-target { padding:var(--space-3); } }

/* Agent 调用配置：导入是辅助入口，标准表单始终保留 */
.agent-auth-config { margin-block:var(--space-6); padding-block:var(--space-4); border-block:1px solid var(--border); }
.agent-auth-config > .field:first-child { max-width:480px; }
.agent-auth-config .od-row > .input { width:0; min-width:0; }
.agent-auth-config .btn { min-height:44px; }
.agent-auth-config .ferr[hidden] { display:none; }
.agent-auth-hint { margin:var(--space-3) 0 0; color:var(--fg-2); overflow-wrap:anywhere; }
.agent-request-preview { margin-bottom:var(--space-4); }
.agent-request-preview summary { padding-block:var(--space-3); cursor:pointer; color:var(--fg); }
.agent-import-actions { gap:var(--space-2); }
.agent-import-note { margin:0 0 var(--space-4); padding:var(--space-3) var(--space-4); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); color:var(--fg-2); font-size:var(--text-sm); line-height:var(--leading-body); overflow-wrap:anywhere; }
.agent-import-dialog .field { margin-top:0; margin-bottom:var(--space-4); }
.agent-import-dialog .textarea { min-height:216px; font-family:var(--font-mono); font-size:var(--text-sm); line-height:var(--leading-body); }
.agent-import-dialog .agent-import-operation { margin-top:var(--space-4); }
.agent-import-dialog .agent-import-preview { margin-top:var(--space-4); padding:var(--space-4); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); }
.agent-import-dialog .agent-import-preview p { margin:0; color:var(--fg-2); line-height:var(--leading-body); }
.agent-import-dialog .agent-import-preview strong { display:block; margin-bottom:var(--space-2); font-family:var(--font-mono); overflow-wrap:anywhere; }
.agent-import-dialog .agent-import-warning { margin-top:var(--space-4); color:var(--fg-2); font-size:var(--text-sm); line-height:var(--leading-body); }
.agent-import-dialog .field-error { margin-top:var(--space-3); }
.agent-response-reference { margin-top:var(--space-4); padding-top:var(--space-3); border-top:1px solid var(--border); }
.agent-response-reference summary { min-height:44px; padding:var(--space-3) 0; color:var(--fg); cursor:pointer; font-size:var(--text-sm); }
@media(hover:hover) { .agent-response-reference summary:hover { background:var(--surface); color:var(--fg); } }

function agentAuth(w) {
  if(w.authType==='bearer')return {type:'bearer',value:w.authValue||''};
  if(w.authType==='basic')return {type:'basic',username:w.authUsername||'',password:w.authPassword||''};
  if(w.authType==='apikey')return {type:'apikey',keyName:(w.authKeyName||'').trim(),in:w.authKeyIn||'header',value:w.authKeyValue||''};
  return {type:'none'};
}
function splitBasicCredential(value,encoded=false) {
  let text=String(value||'');
  if(encoded){try{const bytes=Uint8Array.from(atob(text.trim()),c=>c.charCodeAt(0));try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch(e){text=Array.from(bytes,c=>String.fromCharCode(c)).join('');}}catch(e){throw Error('Basic Authorization 不是有效的 Base64，请检查凭证。');}}
  const at=text.indexOf(':');
  if(encoded&&at<0)throw Error('Basic 凭证必须包含用户名与密码的分隔符。');
  return {authUsername:at<0?text:text.slice(0,at),authPassword:at<0?'':text.slice(at+1)};
}
function loadAgentAuth(w,auth={}) {
  Object.assign(w,{authType:auth.type||'none',authValue:'',authUsername:'',authPassword:'',authKeyName:'X-API-Key',authKeyValue:'',authKeyIn:'header',authErrors:{}});
  if(auth.type==='basic'){
    if(auth.username!==undefined){w.authUsername=auth.username;w.authPassword=auth.password||'';}
    else if(auth.value){try{Object.assign(w,splitBasicCredential(auth.value,!String(auth.value).includes(':')));}catch(e){w.authErrors.authUsername='旧凭证无法还原，请重新填写用户名和密码。';}}
  }else if(auth.type==='apikey'){w.authKeyName=auth.keyName||auth.name||'X-API-Key';w.authKeyIn=auth.in||'header';w.authKeyValue=auth.value||'';}
  else if(auth.type==='bearer')w.authValue=auth.value||'';
}
function agentAuthErrors(w) {
  const a=agentAuth(w),errors={};

    if(!a.value.trim())errors.authValue='请填写服务提供的 Token。';
    else if(/^Bearer\s/i.test(a.value)||/\s/.test(a.value))errors.authValue='只填写 Token，不要包含 Bearer 前缀或空白字符。';

    if(!a.username)errors.authUsername='请填写 Basic Auth 用户名。';
    else if(/[:\x00-\x1f\x7f]/.test(a.username))errors.authUsername='用户名不能包含冒号或控制字符。';
    if(/[\x00-\x1f\x7f]/.test(a.password))errors.authPassword='密码不能包含控制字符。';
  }else if(a.type==='apikey'){
    if(!a.keyName)errors.authKeyName='请填写服务要求的 API Key 参数名。';
    else if(a.in==='header'&&!/^[!#$%&'*+.^_`|~0-9A-Za-z-]+$/.test(a.keyName))errors.authKeyName='Header 名称只能包含合法的 ASCII 字母、数字和符号。';
    else if(/[\x00-\x1f\x7f]/.test(a.keyName))errors.authKeyName='参数名不能包含控制字符。';
    if(!['header','query'].includes(a.in))errors.authKeyIn='请选择 Header 或 Query 参数。';
    if(!a.value.trim())errors.authKeyValue='请填写 API Key 的值。';
    else if(/[\x00-\x1f\x7f]/.test(a.value))errors.authKeyValue='API Key 不能包含控制字符。';
    if(a.in==='query'&&a.keyName){try{if(new URL(w.url).searchParams.has(a.keyName))errors.authKeyName='URL 已包含同名参数，请先移除 URL 中的该参数，避免重复配置。';}catch(e){}}
  }

  if(owned&&(w.headers||[]).some(h=>String(h.k||'').trim().toLowerCase()===owned.toLowerCase()))errors[a.type==='apikey'?'authKeyName':'authType']='自定义 Headers 已包含 '+owned+'，请移除重复项或选择「无鉴权」使用自定义 Header。';

function buildAgentRequest(t,vars) {
  const auth=t.auth||agentAuth(t),headers={};

  if(auth.type==='bearer')setHeader('Authorization','Bearer '+(auth.value||''));
  if(auth.type==='basic'){
    const bytes=new TextEncoder().encode((auth.username||'')+':'+(auth.password||''));
    setHeader('Authorization','Basic '+btoa(Array.from(bytes,n=>String.fromCharCode(n)).join('')));

  if (R() < 0.18) tools.splice(1, 1);
  return [{ name: 'root', type: 'GENERATION', children: [
    { name: 'intent-classify', type: 'SPAN', children: [] },
    { name: 'tool-calls', type: 'SPAN', children: tools },

  return {};

function evalStats(r) {
  const out = {};
  for (const ev of r.snap.evaluators) {
    const cov = { success: 0, not_evaluable: 0, failed: 0 };
    const series = {}; ev.metrics.forEach((m) => { series[m.key] = { type: m.type, options: m.options || null, vals: [], caseNos: [], total:r.limit };  });
    for (const c of r.cases) {
      const e = (c.evaluators || []).find((x) => x.id === ev.id); if (!e) continue;
      if (cov[e.status] !== undefined) cov[e.status]++;
      if (e.status === 'success' && e.values) for (const k in e.values) { if (series[k]) { series[k].vals.push(e.values[k]); series[k].caseNos.push(c.no); } }
    }
    out[ev.id] = { cov: cov, series: series };
  }

let csvDragHeader = null;
function csvClearDrag() {
  csvDragHeader=null;
  document.querySelectorAll('.csv-mapper .is-dragging,.csv-mapper .is-dragover').forEach(el=>el.classList.remove('is-dragging','is-dragover'));
}
document.addEventListener('dragstart', (e) => {
  const header=e.target.closest?.('[data-csv-header]');
  if(header) {
    const index=Number(header.dataset.csvHeader),w=S.lw;
    if(!w||w.step!==3||!csvHeaderExists(w,index)||!e.dataTransfer){e.preventDefault();return;}
    csvDragHeader={index,draft:w};
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('application/x-evalit-csv-header',String(index));
    e.dataTransfer.setData('text/plain',w.headers[index]);
    header.closest('.csv-source,.csv-bound')?.classList.add('is-dragging');
    return;
  }
  const c = e.target.closest ? e.target.closest('[data-src]') : null; if (!c) return;
  try { e.dataTransfer.setData('text/plain', c.dataset.src); } catch (err) {}
  c.classList.add('dragging');
});
document.addEventListener('dragend', () => {
  csvClearDrag();
  document.querySelectorAll('.chip.dragging').forEach(c=>c.classList.remove('dragging'));
});
document.addEventListener('dragover', (e) => {
  const target=e.target.closest?.('[data-csv-target]');
  if(target) {
    if(csvDragHeader&&csvDragHeader.draft===S.lw&&S.lw?.step===3){
      e.preventDefault();e.dataTransfer.dropEffect='move';
      document.querySelectorAll('.csv-mapper .is-dragover').forEach(el=>{if(el!==target)el.classList.remove('is-dragover');});
      target.classList.add('is-dragover');
    }
    return;
  }
  const s=e.target.closest?.('.slot');if(s){e.preventDefault();s.classList.add('dragover');}
});
document.addEventListener('dragleave', (e) => {
  const target=e.target.closest?.('[data-csv-target]');
  if(target){if(!e.relatedTarget||!target.contains(e.relatedTarget))target.classList.remove('is-dragover');return;}
  const s=e.target.closest?.('.slot');if(s)s.classList.remove('dragover');
});
document.addEventListener('drop', (e) => {
  const target=e.target.closest?.('[data-csv-target]');
  if(target) {
    if(!csvDragHeader||csvDragHeader.draft!==S.lw||S.lw?.step!==3)return;
    e.preventDefault();const index=csvDragHeader.index,field=target.dataset.csvTarget;
    csvClearDrag();csvSetMapping(index,field);return;
  }
  const s = e.target.closest ? e.target.closest('.slot') : null; if (!s) return;
  e.preventDefault(); s.classList.remove('dragover');
  let src = null; try { src = JSON.parse(e.dataTransfer.getData('text/plain')); } catch (err) {}
  if (src) bindMapping(s.dataset.own, s.dataset.var, src);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!S.modal&&S.lw?.step===3&&e.target.closest?.('.csv-mapper')&&csvHeaderExists(S.lw,S.lw.mapSelected)){
    e.preventDefault();S.lw.mapSelected=null;S.lw.mapMessage='已取消选择。可继续拖拽表头。';render();
  }
});

/* ═══════════════ 19 · 启动 ═══════════════ */
S.jtOpen = {};
document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('mask')) { closeModal(); return; }
  const el = e.target.closest('[data-action]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.action]; if (fn) { harvest(); fn(el, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]'); if (!el || el.disabled) return;
  const fn = C[el.dataset.change]; if (fn) { harvest(); fn(el, e); }
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-live]'); if (!el) return;
  const fn = L[el.dataset.live]; if (fn) fn(el, e);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) closeModal(); });
DB.runs.filter((r) => r.status === 'running').forEach((r) => { r._ts = Date.now(); setTimeout(() => tickRun(r.id), 1000); });
render();
</script>
</body>
